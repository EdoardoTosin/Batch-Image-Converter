name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── 1. Validate tag and create the GitHub release ─────────────────────────
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          pkg_ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/batch_image_converter/__init__.py)
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$pkg_ver" != "$tag_ver" ]; then
            echo "::error::Tag '$tag_ver' does not match __version__ '$pkg_ver'. Update src/batch_image_converter/__init__.py first."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Batch Image Converter ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 2. Build binaries and attach them to the release ──────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: batch-image-converter-windows.zip
          - os: ubuntu-latest
            archive: batch-image-converter-linux.tar.gz
          - os: macos-latest
            archive: batch-image-converter-macos.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      - name: Cache Nuitka compilation output
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ matrix.os }}-py3.12-${{ hashFiles('src/**/*.py') }}
          restore-keys: nuitka-${{ matrix.os }}-py3.12-

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build binary
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: uv run python tools/build.py

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive
          -Path dist\batch-image-converter.exe
          -DestinationPath dist\${{ matrix.archive }}

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf dist/${{ matrix.archive }} -C dist batch-image-converter

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
